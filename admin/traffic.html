<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Посещаемость сайта · CRM</title>
    <style>
      :root { color-scheme: light; font: 15px/1.5 Arial, sans-serif; color: #302a28; background: #f8f4ef; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(1040px, calc(100% - 32px)); margin: 40px auto; }
      header, section { padding: 22px; margin-bottom: 18px; border: 1px solid #e9dcd2; border-radius: 18px; background: #fffaf6; box-shadow: 0 12px 32px #5e4c4510; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      h1, h2 { margin: 0; }
      h1 { font-size: clamp(1.5rem, 4vw, 2rem); }
      h2 { margin-bottom: 16px; font-size: 1.15rem; }
      p { color: #675d58; }
      button { padding: 10px 16px; border: 0; border-radius: 10px; background: #a95f48; color: white; font-weight: 700; cursor: pointer; }
      .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .metric { padding: 18px; border-radius: 14px; background: #f5ece5; }
      .metric strong { display: block; color: #a95f48; font-size: 2rem; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 9px 8px; border-bottom: 1px solid #eadfd7; text-align: left; overflow-wrap: anywhere; }
      th { color: #587a72; font-size: .82rem; }
      #status { min-height: 1.5em; }
      @media (max-width: 640px) {
        main { margin: 18px auto; }
        header { align-items: flex-start; flex-direction: column; }
        .summary, .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Посещаемость сайта</h1>
          <p>Анонимная статистика за последние 30 дней. IP-адреса не сохраняются.</p>
        </div>
        <button id="refresh" type="button">Обновить</button>
      </header>
      <p id="status" role="status" aria-live="polite"></p>
      <section class="summary" aria-label="Итоги">
        <div class="metric"><span>Просмотры за 30 дней</span><strong id="total">—</strong></div>
        <div class="metric"><span>Дней со статистикой</span><strong id="active-days">—</strong></div>
        <div class="metric"><span>Источников переходов</span><strong id="source-count">—</strong></div>
      </section>
      <div class="grid">
        <section><h2>По дням</h2><div id="days"></div></section>
        <section><h2>Страницы</h2><div id="pages"></div></section>
        <section><h2>Источники</h2><div id="sources"></div></section>
        <section><h2>Устройства</h2><div id="devices"></div></section>
      </div>
    </main>
    <script>
      const statusNode = document.getElementById('status');

      function renderTable(targetId, entries, firstLabel) {
        const target = document.getElementById(targetId);
        target.replaceChildren();
        const table = document.createElement('table');
        const head = table.createTHead().insertRow();
        [firstLabel, 'Посещения'].forEach((label) => {
          const cell = document.createElement('th');
          cell.textContent = label;
          head.append(cell);
        });
        const body = table.createTBody();
        Object.entries(entries || {}).sort((a, b) => b[1] - a[1]).forEach(([name, count]) => {
          const row = body.insertRow();
          row.insertCell().textContent = name;
          row.insertCell().textContent = count;
        });
        if (!body.rows.length) {
          const row = body.insertRow();
          const cell = row.insertCell();
          cell.colSpan = 2;
          cell.textContent = 'Пока нет данных';
        }
        target.append(table);
      }

      async function loadAnalytics() {
        statusNode.textContent = 'Загружаем статистику…';
        try {
          const response = await fetch('/api/admin/analytics', { cache: 'no-store' });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
          const analytics = data.analytics;
          document.getElementById('total').textContent = analytics.total;
          document.getElementById('active-days').textContent = Object.keys(analytics.days || {}).length;
          document.getElementById('source-count').textContent = Object.keys(analytics.sources || {}).length;
          renderTable('days', analytics.days, 'Дата');
          renderTable('pages', analytics.pages, 'Страница');
          renderTable('sources', analytics.sources, 'Источник');
          renderTable('devices', analytics.devices, 'Устройство');
          statusNode.textContent = 'Статистика обновлена.';
        } catch (error) {
          statusNode.textContent = `Не удалось загрузить статистику: ${error.message}`;
        }
      }

      document.getElementById('refresh').addEventListener('click', loadAnalytics);
      loadAnalytics();
    </script>
  </body>
</html>
